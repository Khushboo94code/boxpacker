{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Selection</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --ink: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --good: #22c55e; --bad: #ef4444; --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px; margin-bottom: 20px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 600; }
    input, select {
      width: 100%; padding: 6px 8px; background: #0f172a; color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px; font-size: 0.9rem;
    }
    input.num { text-align: right; }
    button {
      cursor: pointer; border: none; border-radius: 8px; padding: 10px 16px;
      font-size: 0.95rem; font-weight: 600;
    }
    .btn-primary { background: var(--accent); color: #04263a; }
    .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    .btn-del { background: transparent; color: var(--bad); padding: 4px 8px; }
    .row-actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
    .result-box { border-left: 4px solid var(--accent); }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .pill.good { background: rgba(34,197,94,.15); color: var(--good); }
    .pill.bad { background: rgba(239,68,68,.15); color: var(--bad); }
    .big-price { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .muted { color: var(--muted); }
    .eval td { border-top: 1px solid var(--line); }
    .hidden { display: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    code { background: #0f172a; padding: 1px 5px; border-radius: 4px; }
    h3 { margin-bottom: 4px; }
  </style>
</head>
<body>
  {% csrf_token %}
  <div class="wrap">
    <h1>📦 Box Selection</h1>
    <p class="sub">Enter the items in an order and get the cheapest box that actually fits them — computed with real 3D bin packing, not just volume.</p>

    <div class="card">
      <table id="items-table">
        <thead>
          <tr>
            <th style="width:26%">Item</th>
            <th>L (cm)</th><th>W (cm)</th><th>H (cm)</th>
            <th>Weight (kg)</th><th>Qty</th><th></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
      <div class="row-actions">
        <button class="btn-ghost" id="add-row">+ Add item</button>
        <select id="catalog" style="max-width:240px">
          <option value="">Add from catalogue…</option>
        </select>
      </div>
    </div>

    <div class="row-actions">
      <button class="btn-primary" id="recommend">Find cheapest box</button>
      <span class="muted" id="status"></span>
    </div>

    <div id="result" class="card result-box hidden" style="margin-top:20px"></div>
  </div>

  <script>
    const CSRF = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const body = document.getElementById('items-body');
    const catalog = document.getElementById('catalog');
    let products = [];

    function rowTemplate(v = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="f-name" value="${v.name ?? ''}" placeholder="e.g. Book"></td>
        <td><input class="num f-length" type="number" step="0.1" min="0.1" value="${v.length ?? ''}"></td>
        <td><input class="num f-width"  type="number" step="0.1" min="0.1" value="${v.width ?? ''}"></td>
        <td><input class="num f-height" type="number" step="0.1" min="0.1" value="${v.height ?? ''}"></td>
        <td><input class="num f-weight" type="number" step="0.01" min="0" value="${v.weight ?? ''}"></td>
        <td><input class="num f-qty"    type="number" step="1" min="1" value="${v.quantity ?? 1}"></td>
        <td><button class="btn-del" title="Remove">✕</button></td>`;
      tr.querySelector('.btn-del').onclick = () => tr.remove();
      return tr;
    }

    function addRow(v) { body.appendChild(rowTemplate(v)); }

    document.getElementById('add-row').onclick = () => addRow();

    catalog.onchange = () => {
      const p = products.find(x => String(x.id) === catalog.value);
      if (p) addRow({
        name: p.name, length: p.length, width: p.width,
        height: p.height, weight: p.weight, quantity: 1,
      });
      catalog.value = '';
    };

    function readItems() {
      return [...body.querySelectorAll('tr')].map(tr => ({
        name: tr.querySelector('.f-name').value || 'item',
        length: parseFloat(tr.querySelector('.f-length').value),
        width: parseFloat(tr.querySelector('.f-width').value),
        height: parseFloat(tr.querySelector('.f-height').value),
        weight: parseFloat(tr.querySelector('.f-weight').value),
        quantity: parseInt(tr.querySelector('.f-qty').value, 10) || 1,
      }));
    }

    function money(n) { return Number(n).toFixed(2); }

    function render(data) {
      const el = document.getElementById('result');
      el.classList.remove('hidden');
      const s = data.order_summary;
      let head;
      if (data.found) {
        const b = data.recommended_box;
        head = `
          <div><span class="pill good">FITS</span></div>
          <h2 style="margin:10px 0 0">${b.name}</h2>
          <div class="big-price">${money(b.cost)}</div>
          <p class="muted">${b.inner_length}×${b.inner_width}×${b.inner_height} cm ·
             holds up to ${b.max_weight} kg</p>`;
      } else {
        head = `<div><span class="pill bad">NO FIT</span></div>
                <p style="margin-top:10px">${data.detail}</p>`;
      }
      let layoutBlock = '';
      if (data.found && data.layout && data.layout.length) {
        const layoutRows = data.layout.map(p => `
          <tr class="eval">
            <td>${p.item}</td>
            <td class="mono">(${p.position.x}, ${p.position.y}, ${p.position.z})</td>
            <td class="mono">${p.dimensions.length}×${p.dimensions.width}×${p.dimensions.height}</td>
            <td>${p.rotated
              ? '<span class="pill bad">rotated</span>'
              : '<span class="pill good">as-is</span>'}</td>
            <td class="muted">${p.orientation}</td>
          </tr>`).join('');
        layoutBlock = `
          <h3 style="margin:20px 0 4px">Packing layout</h3>
          <p class="muted" style="margin:0 0 8px">
            Where each unit sits inside <b>${data.recommended_box.name}</b>
            — position is the lower corner (cm) from a box corner; dimensions are
            the item's extents along box length×width×height after rotation.
          </p>
          <table>
            <thead><tr>
              <th>Item</th><th>Position (x,y,z)</th><th>Oriented L×W×H</th>
              <th>Angle</th><th>Orientation</th>
            </tr></thead>
            <tbody>${layoutRows}</tbody>
          </table>`;
      }
      const evalRows = data.evaluations.map(e => `
        <tr class="eval">
          <td>${e.box}</td>
          <td>${money(e.cost)}</td>
          <td>${e.fits
            ? '<span class="pill good">fits</span>'
            : '<span class="pill bad">no</span>'}</td>
          <td>${e.fill_rate != null ? (e.fill_rate * 100).toFixed(0) + '%' : '—'}</td>
          <td class="muted">${e.reason}</td>
        </tr>`).join('');
      el.innerHTML = `
        ${head}
        <p class="muted" style="margin-top:16px">
          Order: ${s.total_units} unit(s) · ${s.total_weight_kg} kg ·
          ${s.total_item_volume_cm3} cm³ of goods
        </p>
        <table style="margin-top:8px">
          <thead><tr>
            <th>Box</th><th>Cost</th><th>Fits?</th><th>Fill</th><th>Why</th>
          </tr></thead>
          <tbody>${evalRows}</tbody>
        </table>
        ${layoutBlock}`;
      el.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('recommend').onclick = async () => {
      const items = readItems();
      const status = document.getElementById('status');
      const bad = items.find(i => !(i.length > 0 && i.width > 0 && i.height > 0) || isNaN(i.weight));
      if (!items.length) { status.textContent = 'Add at least one item.'; return; }
      if (bad) { status.textContent = 'Every item needs positive L/W/H and a weight.'; return; }
      status.textContent = 'Packing…';
      try {
        const res = await fetch('/api/recommend/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
          body: JSON.stringify({ items }),
        });
        const data = await res.json();
        if (!res.ok) { status.textContent = data.detail || 'Request failed.'; return; }
        status.textContent = '';
        render(data);
      } catch (err) {
        status.textContent = 'Network error: ' + err.message;
      }
    };

    // Load catalogue for the dropdown, and seed a couple of example rows.
    fetch('/api/products/').then(r => r.json()).then(list => {
      products = list;
      catalog.insertAdjacentHTML('beforeend',
        list.map(p => `<option value="${p.id}">${p.name}</option>`).join(''));
    });
    addRow({ name: 'Paperback Book', length: 20, width: 13, height: 3, weight: 0.3, quantity: 2 });
    addRow({ name: 'Coffee Mug', length: 12, width: 9, height: 11, weight: 0.4, quantity: 1 });
  </script>
</body>
</html>
